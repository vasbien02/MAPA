<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamiliaSegura 📍</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: #f0f4f0; padding: 24px;
}
.card {
  background: white; border-radius: 20px; padding: 32px 26px;
  width: 100%; max-width: 380px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center;
}
.icon { font-size: 54px; margin-bottom: 16px; }
h1 { font-size: 21px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
p  { font-size: 14px; color: #777; line-height: 1.65; margin-bottom: 22px; }
input {
  width: 100%; padding: 13px 14px; border: 1px solid #ddd;
  border-radius: 10px; font-size: 15px; margin-bottom: 14px;
  outline: none; font-family: inherit;
}
input:focus { border-color: #1D9E75; }
.btn {
  display: block; width: 100%; padding: 15px;
  border-radius: 13px; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer;
  margin-bottom: 10px; transition: opacity 0.15s;
}
.btn:active { opacity: 0.8; }
.btn-green { background: #1D9E75; color: white; }
.btn-wa    { background: #25D366; color: white; }
.btn-gray  { background: #f0f0f0; color: #444; font-size: 14px; }
.box {
  background: #f7f7f7; border-radius: 10px; padding: 12px 14px;
  font-size: 12px; color: #555; word-break: break-all;
  text-align: left; border: 1px solid #e8e8e8; margin-bottom: 10px;
}
.spin {
  width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid #e0e0e0; border-top-color: #1D9E75;
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.success-box {
  background: #e1f5ee; border: 1px solid #1D9E75;
  border-radius: 14px; padding: 20px; margin-top: 16px;
}
.error-box {
  background: #fde8e8; border: 1px solid #E24B4A;
  border-radius: 14px; padding: 20px; margin-top: 16px;
}
.info-row {
  display: flex; justify-content: space-between;
  font-size: 12px; padding: 4px 0;
  border-bottom: 1px solid #c8eedd;
}
.info-row:last-child { border-bottom: none; }
.info-label { color: #555; }
.info-value { font-weight: 600; color: #0F6E56; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spin"></div>
  <p style="margin:0;color:#aaa;font-size:13px">Cargando...</p>
</div>

<script>
// ── Leer parámetros de la URL ──────────────────────────
const params  = new URLSearchParams(window.location.search);
const modo    = params.get('m');     // 'p' = padre, vacío = niño
const retorno = params.get('r');     // URL de retorno codificada (para el niño)
const lat     = params.get('lat');   // lat recibida (para el padre)
const lng     = params.get('lng');   // lng recibida (para el padre)
const acc     = params.get('acc');   // precisión
const ts      = params.get('ts');    // timestamp

const BASE = window.location.href.split('?')[0];

// ══════════════════════════════════════════
// MODO PADRE — recibe ubicación de vuelta
// ══════════════════════════════════════════
if (modo === 'p' && lat && lng) {
  const time = ts ? new Date(parseInt(ts)) : new Date();
  const timeStr = time.getHours().toString().padStart(2,'0') + ':' +
                  time.getMinutes().toString().padStart(2,'0') + ':' +
                  time.getSeconds().toString().padStart(2,'0');
  const mapsUrl = 'https://www.google.com/maps?q=' + lat + ',' + lng;

  document.getElementById('card').innerHTML = `
    <div class="icon">✅</div>
    <h1>¡Ubicación recibida!</h1>
    <div class="success-box" style="margin-bottom:16px">
      <div class="info-row"><span class="info-label">Latitud</span><span class="info-value">${parseFloat(lat).toFixed(5)}</span></div>
      <div class="info-row"><span class="info-label">Longitud</span><span class="info-value">${parseFloat(lng).toFixed(5)}</span></div>
      <div class="info-row"><span class="info-label">Precisión</span><span class="info-value">${acc ? Math.round(acc)+' m' : '—'}</span></div>
      <div class="info-row" style="border:none"><span class="info-label">Hora</span><span class="info-value">${timeStr}</span></div>
    </div>
    <a href="${mapsUrl}" target="_blank" style="text-decoration:none">
      <button class="btn btn-green">🗺️ Ver en Google Maps</button>
    </a>
    <button class="btn btn-gray" onclick="showDad()">🔄 Generar nuevo link</button>
  `;
}

// ══════════════════════════════════════════
// MODO PADRE — pantalla inicial
// ══════════════════════════════════════════
else if (modo === 'p' || (!modo && !retorno && !lat)) {
  showDad();
}

// ══════════════════════════════════════════
// MODO NIÑO — alguien abrió el link
// ══════════════════════════════════════════
else if (retorno) {
  document.getElementById('card').innerHTML = `
    <div class="icon">📍</div>
    <h1>Compartir ubicación</h1>
    <p>Tu familia quiere saber que estás bien.<br>Toca el botón para enviar tu ubicación.</p>
    <button class="btn btn-green" id="share-btn" onclick="shareLocation()">📍 Compartir mi ubicación</button>
    <div id="kid-state"></div>
  `;
}

// Sin parámetros → modo padre
else {
  showDad();
}

// ── FUNCIONES ──────────────────────────────────────────

function showDad() {
  const savedName = localStorage.getItem('dad-name') || '';
  document.getElementById('card').innerHTML = `
    <div class="icon">🛡️</div>
    <h1>FamiliaSegura</h1>
    <p>Genera un link y envíaselo al niño por WhatsApp. Cuando lo abra y acepte, recibirás su ubicación exacta aquí mismo.</p>
    <input type="text" id="name-inp" placeholder="Tu nombre (Papá / Mamá)" value="${savedName}">
    <button class="btn btn-green" onclick="generateLink()">🔗 Generar link</button>
    <div id="link-area" style="display:none">
      <div class="box" id="link-txt"></div>
      <button class="btn btn-wa"   onclick="sendWA()">💬 Enviar por WhatsApp</button>
      <button class="btn btn-gray" onclick="copyLink()">📋 Copiar link</button>
    </div>
  `;
}

function generateLink() {
  const name = (document.getElementById('name-inp').value || 'Tu familia').trim();
  localStorage.setItem('dad-name', name);

  // La URL de retorno es esta misma página en modo padre
  // Cuando el niño comparte su GPS, la página le redirige a:
  // BASE?m=p&lat=XX&lng=YY&acc=ZZ&ts=TTT
  const retornoUrl = BASE + '?m=p&lat={LAT}&lng={LNG}&acc={ACC}&ts={TS}';
  const kidLink = BASE + '?r=' + encodeURIComponent(retornoUrl) + '&de=' + encodeURIComponent(name);

  document.getElementById('link-txt').textContent = kidLink;
  document.getElementById('link-area').style.display = 'block';
}

function sendWA() {
  const name = localStorage.getItem('dad-name') || 'Tu familia';
  const link = document.getElementById('link-txt').textContent;
  const msg  = '😊 ' + name + ' quiere saber que estás bien. Toca aquí: ' + link;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function copyLink() {
  const link = document.getElementById('link-txt').textContent;
  navigator.clipboard.writeText(link)
    .then(() => {
      const btn = event.target;
      btn.textContent = '✅ Copiado';
      setTimeout(() => btn.textContent = '📋 Copiar link', 2000);
    })
    .catch(() => prompt('Copia este link:', link));
}

// ── El niño comparte su ubicación ──────────────────────
window.shareLocation = function() {
  const stateEl = document.getElementById('kid-state');
  const shareBtn = document.getElementById('share-btn');

  if (!navigator.geolocation) {
    stateEl.innerHTML = `<div class="error-box"><b style="color:#A32D2D">GPS no disponible</b><br><span style="font-size:12px;color:#888">Abre este link en Safari (iPhone) o Chrome (Android).</span></div>`;
    return;
  }

  shareBtn.disabled = true;
  shareBtn.textContent = '⏳ Obteniendo GPS...';
  stateEl.innerHTML = '';

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = Math.round(pos.coords.accuracy);
      const ts  = Date.now();

      // Construir URL de retorno con la ubicación real
      const decoded = decodeURIComponent(retorno);
      const returnUrl = decoded
        .replace('{LAT}', lat)
        .replace('{LNG}', lng)
        .replace('{ACC}', acc)
        .replace('{TS}',  ts);

      // 1. Redirigir al niño a Google Maps
      window.location.href = 'https://www.google.com/maps?q=' + lat + ',' + lng;

      // 2. Abrir la URL de retorno en una nueva pestaña para el padre
      //    (en móvil esto puede ser bloqueado, por eso también mostramos el link)
      try { window.open(returnUrl, '_blank'); } catch(e) {}

      // Mostrar también el link para que el niño pueda reenviarlo si hace falta
      stateEl.innerHTML = `
        <div class="success-box" style="margin-top:14px">
          <div style="font-size:14px;font-weight:700;color:#0F6E56;margin-bottom:8px">✅ Ubicación enviada</div>
          <div style="font-size:12px;color:#555;margin-bottom:10px">Redirigiendo a Google Maps...</div>
          <div style="font-size:11px;color:#888">Si el mapa no abre, toca aquí:</div>
          <a href="https://www.google.com/maps?q=${lat},${lng}" style="font-size:12px;color:#1D9E75;font-weight:600">Ver mi ubicación en Google Maps</a>
        </div>`;
    },
    err => {
      shareBtn.disabled  = false;
      shareBtn.textContent = '📍 Compartir mi ubicación';
      const msgs = {
        1: 'Permiso denegado. En iPhone: Ajustes → Safari → Ubicación → Preguntar o Permitir.',
        2: 'GPS no disponible. Activa la ubicación en tu móvil.',
        3: 'Tiempo de espera. Inténtalo de nuevo.'
      };
      stateEl.innerHTML = `<div class="error-box"><b style="color:#A32D2D;display:block;margin-bottom:6px">No se pudo obtener la ubicación</b><span style="font-size:12px;color:#888">${msgs[err.code]||'Error desconocido.'}</span></div>`;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
};
</script>
</body>
</html>
