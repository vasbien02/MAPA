<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi ubicación</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0f4f0;
  padding: 24px;
}
.card {
  background: white;
  border-radius: 20px;
  padding: 32px 28px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  text-align: center;
}
.icon { font-size: 52px; margin-bottom: 16px; }
h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
p  { font-size: 14px; color: #777; line-height: 1.6; margin-bottom: 24px; }
.btn {
  display: block; width: 100%;
  padding: 16px; border-radius: 14px; border: none;
  font-size: 16px; font-weight: 700; cursor: pointer;
  margin-bottom: 12px; transition: opacity 0.2s;
}
.btn:active { opacity: 0.8; }
.btn-green { background: #1D9E75; color: white; }
.btn-wa    { background: #25D366; color: white; }
.btn-copy  { background: #f0f0f0; color: #333; font-size: 14px; }

.link-box {
  background: #f7f7f7;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 12px;
  color: #555;
  word-break: break-all;
  margin-bottom: 12px;
  display: none;
  text-align: left;
  border: 1px solid #e8e8e8;
}
.spin {
  width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid #e0e0e0; border-top-color: #1D9E75;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.tag {
  display: inline-block;
  background: #e1f5ee; color: #0F6E56;
  font-size: 11px; font-weight: 600;
  padding: 3px 10px; border-radius: 20px;
  margin-bottom: 20px;
}
</style>
</head>
<body>
<div class="card" id="card">
  <!-- Estado inicial: cargando -->
  <div id="state-loading">
    <div class="spin"></div>
    <p>Detectando ubicación...</p>
  </div>
</div>

<script>
const params    = new URLSearchParams(window.location.search);
const modo      = params.get('modo');   // 'padre' o vacío
const sesion    = params.get('s');      // ID de sesión

// Firebase config
const FB_URL = 'https://mapapapa-30bb4-default-rtdb.europe-west1.firebasedatabase.app';

// ════════════════════════════════
// MODO NIÑO — alguien abrió el link
// ════════════════════════════════
if (!modo && sesion) {
  // Pedir GPS directamente
  if (!navigator.geolocation) {
    showError('Tu navegador no soporta GPS. Abre este link en Safari o Chrome.');
  } else {
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy);

        // Guardar en Firebase
        fetch(FB_URL + '/sesiones/' + sesion + '/ubicacion.json', {
          method: 'PUT',
          body: JSON.stringify({ lat, lng, acc, ts: Date.now(), ok: true })
        }).catch(() => {});

        // Redirigir a Google Maps inmediatamente
        window.location.href = 'https://www.google.com/maps?q=' + lat + ',' + lng;
      },
      err => {
        // Si falla el GPS de alta precisión, intentar con baja precisión
        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            fetch(FB_URL + '/sesiones/' + sesion + '/ubicacion.json', {
              method: 'PUT',
              body: JSON.stringify({ lat, lng, acc: Math.round(pos.coords.accuracy), ts: Date.now(), ok: true })
            }).catch(() => {});
            window.location.href = 'https://www.google.com/maps?q=' + lat + ',' + lng;
          },
          () => showError('No se pudo obtener la ubicación.<br>Activa el GPS e inténtalo de nuevo.'),
          { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
        );
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }
}

// ════════════════════════════════
// MODO PADRE — gestión de links
// ════════════════════════════════
else if (modo === 'padre') {
  showDadView();
}

// Sin parámetros — mostrar modo padre por defecto
else {
  showDadView();
}

// ── FUNCIONES ────────────────────────────────────────

function showDadView() {
  const savedName = localStorage.getItem('dad-name') || '';
  document.getElementById('card').innerHTML = `
    <div class="icon">🛡️</div>
    <h1>FamiliaSegura</h1>
    <p>Escribe tu nombre y genera el link. Envíaselo al niño por WhatsApp. Cuando lo abra verás su ubicación exacta.</p>

    <input type="text" id="name-inp" placeholder="Tu nombre (Papá / Mamá)"
      value="${savedName}"
      style="width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;
             font-size:15px;margin-bottom:14px;outline:none;font-family:inherit">

    <button class="btn btn-green" onclick="generateLink()">🔗 Generar link</button>

    <div class="link-box" id="link-box"></div>

    <button class="btn btn-wa"   id="btn-wa"   style="display:none" onclick="sendWhatsApp()">💬 Enviar por WhatsApp</button>
    <button class="btn btn-copy" id="btn-copy" style="display:none" onclick="copyLink()">📋 Copiar link</button>

    <div id="waiting" style="display:none;margin-top:20px;padding:16px;background:#f7fdf9;border-radius:12px;border:1px solid #b8e6d0">
      <div style="font-size:13px;color:#1D9E75;font-weight:600;margin-bottom:6px">⏳ Esperando que el niño abra el link...</div>
      <div style="font-size:12px;color:#888">Cuando lo abra, aquí aparecerá su ubicación y un botón para verla en el mapa.</div>
    </div>

    <div id="result" style="display:none;margin-top:20px;padding:16px;background:#e1f5ee;border-radius:12px;border:1px solid #1D9E75">
      <div style="font-size:22px;margin-bottom:8px">✅</div>
      <div style="font-size:15px;font-weight:700;color:#0F6E56;margin-bottom:6px">¡Ubicación recibida!</div>
      <div style="font-size:12px;color:#555;margin-bottom:14px" id="result-info"></div>
      <button class="btn btn-green" onclick="openMap()">🗺️ Ver en Google Maps</button>
      <button class="btn btn-copy" style="margin-top:8px" onclick="generateLink()">🔄 Generar nuevo link</button>
    </div>
  `;
}

let currentSession = null;
let pollInterval   = null;
let receivedLat    = null;
let receivedLng    = null;

function generateLink() {
  const name = document.getElementById('name-inp').value.trim() || 'Tu familia';
  localStorage.setItem('dad-name', name);

  currentSession = 'fs' + Date.now().toString(36);
  const base = window.location.href.split('?')[0];
  const link = base + '?s=' + currentSession;

  document.getElementById('link-box').textContent = link;
  document.getElementById('link-box').style.display = 'block';
  document.getElementById('btn-wa').style.display   = 'block';
  document.getElementById('btn-copy').style.display = 'block';
  document.getElementById('waiting').style.display  = 'block';
  document.getElementById('result').style.display   = 'none';

  // Escuchar Firebase con polling cada 3 segundos
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(checkLocation, 3000);
}

function checkLocation() {
  if (!currentSession) return;
  fetch(FB_URL + '/sesiones/' + currentSession + '/ubicacion.json')
    .then(r => r.json())
    .then(data => {
      if (data && data.ok && data.lat) {
        clearInterval(pollInterval);
        receivedLat = data.lat;
        receivedLng = data.lng;
        const t = new Date(data.ts);
        const timeStr = t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');
        document.getElementById('waiting').style.display = 'none';
        document.getElementById('result').style.display  = 'block';
        document.getElementById('result-info').textContent =
          'Lat: ' + data.lat.toFixed(5) + '  Lng: ' + data.lng.toFixed(5) +
          '  ·  Precisión: ' + data.acc + ' m  ·  ' + timeStr;
      }
    }).catch(() => {});
}

function sendWhatsApp() {
  const name = localStorage.getItem('dad-name') || 'Tu familia';
  const link = document.getElementById('link-box').textContent;
  const msg  = name + ' quiere saber que estás bien 😊 Toca el link: ' + link;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function copyLink() {
  const link = document.getElementById('link-box').textContent;
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✅ Copiado';
    setTimeout(() => btn.textContent = '📋 Copiar link', 2000);
  }).catch(() => {
    prompt('Copia este link:', link);
  });
}

function openMap() {
  if (receivedLat && receivedLng)
    window.open('https://www.google.com/maps?q=' + receivedLat + ',' + receivedLng, '_blank');
}

function showError(msg) {
  document.getElementById('card').innerHTML = `
    <div class="icon">⚠️</div>
    <h1>No se pudo obtener la ubicación</h1>
    <p>${msg}</p>
    <button class="btn btn-green" onclick="location.reload()">Intentar de nuevo</button>
  `;
}
</script>
</body>
</html>
